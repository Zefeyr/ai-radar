name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    name: Lint & Style Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  test:
    name: Unit & Integration Tests (Pytest)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_radar_user
          POSTGRES_PASSWORD: ai_radar_password
          POSTGRES_DB: ai_radar_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://ai_radar_user:ai_radar_password@localhost:5432/ai_radar_db
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: llama3.2
        run: |
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://ai_radar_user:ai_radar_password@localhost:5432/ai_radar_db
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: llama3.2
        run: |
          pytest -v -s

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-radar:test